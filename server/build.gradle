plugins {
    id 'java'
    id 'application'
    // The Shadow plugin is the standard for creating "Fat Jars"
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'com.openrsc'
version = '1.0'

/*dependencyLocking { // Disabled until stable build.gradle is ready
    lockAllConfigurations()
}*/

// === 1. Dependency Version Management (Recommendation: Use a separate 'libs.versions.toml' file in a real project) ===
def versions = [
    // Core
    commonsLang3   : '3.14.0', // Updated from 3.12.0
    commonsCodec   : '1.16.1', // Updated from 1.14
    commonsCompress: '1.26.1', // Updated from 1.18.0
    guava          : '33.5.0-jre', // Updated from 30.1.1
    guice          : '7.0.0', // Updated from 5.0.2

    // Networking & IO
    netty          : '4.1.110.Final', // Updated from 4.1.33.Final
    disruptor      : '4.0.0', // Updated from 3.3.11, 3.3.5, and 3.3.0

    // Logging
    log4j          : '2.23.1', // Updated from 2.17.0
    slf4j          : '2.0.17', // Updated from 2.0.0-alpha5

    // XML & JSON
    xpp3           : '1.1.4c',
    xstream        : '1.4.21', // Updated from 1.4.18
    json           : '20231013', // Updated from 20190722

    // Database
    sqlite         : '3.45.1.0', // Updated from 3.34.0
    mysql          : '9.5.0', // Updated from 9.4.0

    // Integrations
    emojiJava      : '5.1.1',
    gitlab4j       : '6.2.0', // Updated from 4.12.17

    // Legacy
    commonsLang    : '2.6'
]

// === Java Version Configuration ===
java {
    // This is configured to use Java 21 LTS for modern performance and security
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

// === Directory Configuration ===
sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
    // Creating a separate sourceSet for plugins
    plugins {
        java {
            srcDirs = ['plugins']
        }
        // This is the key: Plugins must compile against the Core (main) output
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

// === Repositories & Dependencies ===
repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // --- Core Dependencies ---

    // Core Logic
    implementation("org.apache.commons:commons-lang3:${versions.commonsLang3}")
    implementation "commons-codec:commons-codec:${versions.commonsCodec}"
    implementation "org.apache.commons:commons-compress:${versions.commonsCompress}"
    implementation "com.google.guava:guava:${versions.guava}"
    implementation "com.google.inject:guice:${versions.guice}"

    // Networking & IO
    implementation "io.netty:netty-all:${versions.netty}"
    implementation "com.lmax:disruptor:${versions.disruptor}"

    // Logging
    // Use the BOM (Bill of Materials) for Log4j for consistent versions
    implementation enforcedPlatform("org.apache.logging.log4j:log4j-bom:${versions.log4j}")
    implementation 'org.apache.logging.log4j:log4j-api'
    implementation 'org.apache.logging.log4j:log4j-core'
    implementation 'org.apache.logging.log4j:log4j-iostreams'
    implementation("org.apache.logging.log4j:log4j-slf4j2-impl")

    // XML & JSON
    implementation "xpp3:xpp3:${versions.xpp3}"
    implementation "com.thoughtworks.xstream:xstream:${versions.xstream}"
    implementation "org.json:json:${versions.json}"

    // Database
    implementation "org.xerial:sqlite-jdbc:${versions.sqlite}"
    implementation "com.mysql:mysql-connector-j:${versions.mysql}"

    // Integrations
    implementation files('lib/JDA-4.0.0_55-withDependencies-sansSLF4J.jar')
    // Contains a fat jar with many dependencies and requires out of scope work
    implementation "com.vdurmont:emoji-java:${versions.emojiJava}"
    implementation "org.gitlab4j:gitlab4j-api:${versions.gitlab4j}"

    // Legacy Support
    implementation "commons-lang:commons-lang:${versions.commonsLang}"
    // Old commons-lang 2.6, required for legacy code in AvatarFormat class
}

test {
    useJUnitPlatform()
}

// === Main Class Configuration ===
application {
    mainClass = 'com.openrsc.server.Server'
}

// === Task: Compile Core (Fat Jar) ===
shadowJar {
    archiveFileName = 'core.jar'
    destinationDirectory = file("$projectDir")
    mergeServiceFiles()

    manifest {
        attributes 'Main-Class': application.mainClass
    }
}

// === Task: Compile Plugins ===
tasks.register('pluginJar', Jar) {
    archiveFileName = 'plugins.jar'
    destinationDirectory = file("$projectDir")
    from sourceSets.plugins.output

    // Plugins usually need access to the Core classes at runtime
    // DEPENDS ON 'shadowJar' for the full Core JAR to exist before plugins compile/run
    dependsOn shadowJar
}

// === Task: Run Server (Java 8 / G1GC) ===
// ... (omitted for brevity, no changes needed) ...

// === Task: Run Server (Java 17+ / ZGC) ===
// ... (omitted for brevity, no changes needed) ...

// === Task: Clean ===
clean {
    delete 'core.jar', 'plugins.jar', 'build'
}

// Ensure running 'gradle build' generates both JARs
build.dependsOn shadowJar, pluginJar
